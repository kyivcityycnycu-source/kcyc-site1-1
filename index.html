    <!-- Favicon Logic -->
    <script>
      (function() {
        const lightIcon = "https://firebasestorage.googleapis.com/v0/b/kcyc-site-b9544.firebasestorage.app/o/LOGO%20KCYC%2FFrame%201015.png?alt=media&token=20a95cbe-9e20-4477-a15d-56c2dfab5760";
        const darkIcon = "https://firebasestorage.googleapis.com/v0/b/kcyc-site-b9544.firebasestorage.app/o/LOGO%20KCYC%2FFrame%201018%20(1)%20(1).png?alt=media&token=4559e74f-633a-4c5e-905d-f13b354e0eda";

        function updateFavicon() {
          const favicon = document.getElementById('dynamic-favicon');
          const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (favicon) {
            favicon.href = isDark ? darkIcon : lightIcon;
          }
        }

        // Run immediately
        updateFavicon();

        // Listen for changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);
      })();
    </script>

      html, body {

      /* Shimmer Animation */
      @keyframes shimmer {
        0% { background-position: -468px 0; }
        100% { background-position: 468px 0; }

      .animate-shimmer {
        animation: shimmer 1.5s infinite linear;
        background: linear-gradient(to right, #f6f7f8 8%, #edeef1 18%, #f6f7f8 33%);

      }
